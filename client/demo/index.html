<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inspect demo</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f4f4f7; color: #1c1c1f; }
      header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #e4e4ea; }
      header h1 { font-size: 18px; margin: 0; flex: 1; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 24px; }
      .card { background: #fff; border: 1px solid #e4e4ea; border-radius: 12px; padding: 16px; }
      .card h2 { font-size: 15px; margin: 0 0 8px; }
      canvas { width: 100%; height: 160px; border-radius: 8px; background: #111; display: block; }
      button.demo { padding: 8px 14px; border-radius: 8px; border: 1px solid #d4d4dc; background: #fff; cursor: pointer; }
      .stat { font-size: 32px; font-weight: 700; }
      .broken { color: #b91c1c; }
      pre#last { grid-column: 1 / -1; background: #111; color: #d4d4d8; padding: 16px; border-radius: 12px; overflow: auto; max-height: 300px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Acme Cameras</h1>
      <button class="demo" id="throw">Trigger console error</button>
      <button class="demo" id="open">Open inspect</button>
    </header>
    <main>
      <section class="card" data-testid="live-view">
        <h2>Live view — Front door</h2>
        <canvas id="cam" width="640" height="320"></canvas>
      </section>
      <section class="card">
        <h2>Events today</h2>
        <div class="stat">1,284</div>
        <p class="broken">Chart failed to load (NaN%)</p>
      </section>
      <section class="card" id="settings">
        <h2>Settings</h2>
        <label><input type="checkbox" checked /> Motion alerts</label><br />
        <label><input type="checkbox" /> Night mode</label>
      </section>
      <pre id="last">Submitted reports appear here (mock mode).</pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
