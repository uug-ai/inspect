name: Release

# One manual entrypoint for both artifacts, released under the same version:
#   - ghcr.io/uug-ai/inspect: signed, hardened server image, plus a gitops PR
#     that rolls it out to inspect.uug.ai (production-bijlokehof)
#   - @uug-ai/inspect on npmjs: the browser library
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      existing_tag:
        description: Existing release to retry (empty creates the next version)
        type: string
        default: ""
      publish:
        description: Publish after verification (false validates without creating a version)
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Keep the release draft until the shared verification gates pass.
  bump-release:
    if: inputs.publish && inputs.existing_tag == ''
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@main
    with:
      bump: ${{ inputs.bump }}
      draft: true
    secrets: inherit

  server-image:
    needs: bump-release
    if: ${{ always() && !cancelled() && (needs.bump-release.result == 'success' || needs.bump-release.result == 'skipped') }}
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      organization: uug-ai
      project: inspect
      tag: ${{ inputs.existing_tag || needs.bump-release.outputs.tag }}
      sign: true
      docker_context: server
      hardened: true
      # Long-running HTTP service; image/smoke-test.sh checks the static
      # runtime offline and never contacts GitHub.
      hardened_profile: standalone
      hardened_workdir: /app
      artifact_prefix: inspect
      publish: ${{ inputs.publish }}
      finalize_release: true
      use_private_module_auth: false
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
      create_gitops_pr: ${{ inputs.publish }}
      gitops_repo: uug-ai/gitops
      gitops_file: environments/production-bijlokehof/inspect/deployment.yaml
      gitops_key: .spec.template.spec.containers[0].image
      gitops_value: ghcr.io/uug-ai/inspect:${{ inputs.existing_tag || needs.bump-release.outputs.tag }}
    secrets: inherit

  # The library doesn't depend on the image, so a failed gitops PR step (or
  # image retry) doesn't block it. npm trusted publishing only accepts runs
  # started by npm-publish.yml itself, so start it as its own run.
  npm-package:
    needs: bump-release
    if: ${{ always() && !cancelled() && inputs.publish && (needs.bump-release.result == 'success' || needs.bump-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start "Publish npm package"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.existing_tag || needs.bump-release.outputs.tag }}
        run: |
          gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$TAG"
          echo "Started npm publish for $TAG: https://github.com/$GITHUB_REPOSITORY/actions/workflows/npm-publish.yml" >> "$GITHUB_STEP_SUMMARY"
