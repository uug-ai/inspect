name: Publish npm package

# Publishes @uug-ai/inspect for an existing release tag using npm trusted
# publishing (GitHub OIDC): no npm token, no 2FA prompt, provenance included.
# npmjs.com trusts exactly this workflow file, so it must always be the
# top-level run: release.yml starts it with `gh workflow run`, and it can be
# run by hand (Actions -> Publish npm package) to (re)publish a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Publish (skipped if this version is already on npm)
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$name@$version is already published"
            exit 0
          fi
          npm publish --access public --registry=https://registry.npmjs.org/
